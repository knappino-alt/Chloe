name: Sestavit Chloe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sestavit APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Přejmenovat
        run: cp app/build/outputs/apk/debug/app-debug.apk Chloe.apk

      - name: Vydat ke stažení
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chloe 1.0.${{ github.run_number }}
          body: |
            Stáhni **Chloe.apk** na tablet a nainstaluj.
            Nejnovější verze je vždy nahoře.
          files: Chloe.apk
          make_latest: true
